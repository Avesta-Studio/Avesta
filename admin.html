            </div>

        function checkPassword() {
            if(document.getElementById("admin-password").value === SECRET_CODE) { sessionStorage.setItem("avesta_admin", "true"); showDashboard(); } 
            else { document.getElementById("login-error").classList.remove("hidden"); }

        function logout() {
            sessionStorage.removeItem("avesta_admin");
            document.getElementById("dashboard-section").classList.add("hidden");
            document.getElementById("logout-btn").classList.add("hidden");
            document.getElementById("login-section").classList.remove("hidden");

            document.getElementById("admin-password").value = "";
            document.getElementById("login-error").classList.add("hidden");

        function showDashboard() {
            document.getElementById("login-section").classList.add("hidden");
            document.getElementById("login-section").classList.remove("flex");
            document.getElementById("dashboard-section").classList.remove("hidden");
            document.getElementById("dashboard-section").classList.add("flex");
            document.getElementById("logout-btn").classList.remove("hidden");

        // --- CUSTOM MODAL LOGIC ---
        function showCustomAlert(title, message, type) {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-modal-text').innerHTML = message;
            
            const iconContainer = document.getElementById('alert-icon-container');
            const icon = document.getElementById('alert-icon');
            
            if(type === 'success') {
                iconContainer.className = "w-12 h-12 rounded-full border border-green-500/30 bg-green-500/10 flex items-center justify-center mx-auto mb-4";
                icon.className = "fa-solid fa-check text-green-400 text-xl";
            } else {
                iconContainer.className = "w-12 h-12 rounded-full border border-red-500/30 bg-red-500/10 flex items-center justify-center mx-auto mb-4";
                icon.className = "fa-solid fa-xmark text-red-500 text-xl";
            }

            document.getElementById('custom-alert-modal').classList.remove('hidden');
            document.getElementById('custom-alert-modal').classList.add('flex');
        }

        function closeAlertModal() {
            document.getElementById('custom-alert-modal').classList.add('hidden');
            document.getElementById('custom-alert-modal').classList.remove('flex');
        }

        function deleteOrder(orderId) {
            currentOrderIdToDelete = orderId;
            document.getElementById('confirm-modal-text').innerHTML = `Are you sure you want to permanently delete <strong>Order #${orderId}</strong>?<br><br>This action cannot be undone.`;
            document.getElementById('custom-confirm-modal').classList.remove('hidden');
            document.getElementById('custom-confirm-modal').classList.add('flex');
        }

        function closeConfirmModal() {
            document.getElementById('custom-confirm-modal').classList.add('hidden');
            document.getElementById('custom-confirm-modal').classList.remove('flex');
            currentOrderIdToDelete = null;
        }

        async function executeDelete() {
            if(!currentOrderIdToDelete) return;
            const orderId = currentOrderIdToDelete;
            closeConfirmModal();

            try {
                await db.collection("orders").doc(orderId).delete();
                showCustomAlert("Success", `Order <strong>#${orderId}</strong> has been deleted successfully.`, "success");
                fetchOrders(); 
            } catch (error) {
                showCustomAlert("Error", "Failed to delete order. Please try again.", "error");
            }
        }
        // --------------------------

        async function updateOrderStatus(orderId) {
            const selectElement = document.getElementById(`status-${orderId}`);
            const updateBtn = document.getElementById(`btn-${orderId}`);
            updateBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            try {
                await db.collection("orders").doc(orderId).update({ status: selectElement.value });
                updateBtn.innerHTML = '<i class="fa-solid fa-check"></i> Updated';
                updateBtn.classList.replace("bg-gold/10", "bg-green-500/20");
                updateBtn.classList.replace("text-gold", "text-green-400");
                setTimeout(() => {
                    updateBtn.innerHTML = 'Update';
                    updateBtn.classList.replace("bg-green-500/20", "bg-gold/10");
                    updateBtn.classList.replace("text-green-400", "text-gold");
                    fetchOrders();
                }, 2000);
            } catch (error) { 
                showCustomAlert("Error", "Failed to update status. Please try again.", "error");
                updateBtn.innerHTML = 'Update'; 
            }
        }

        async function fetchOrders() {
            document.getElementById("orders-container").classList.add("hidden");
            document.getElementById("loading-spinner").classList.remove("hidden");
            document.getElementById("loading-spinner").classList.add("flex");

            try {
                const snapshot = await db.collection("orders").orderBy("timestamp", "desc").get();
                const container = document.getElementById("orders-container");

                    container.innerHTML = '<div class="text-center text-gray-500 py-10 text-xs tracking-widest uppercase"><i class="fa-solid fa-box-open text-2xl mb-3 block"></i> No orders found</div>';

                        const data = doc.data();

                        }

                        let itemsHTML = '';
                        if(data.items && data.items.length > 0) {

                        if(data.status === "Order Confirmed") statusColor = "text-yellow-400";
                        if(data.status === "In Workshop") statusColor = "text-blue-400";
                        if(data.status === "Shipped") statusColor = "text-purple-400";
                        if(data.status === "Delivered") statusColor = "text-green-400";

                        let methodBadge = data.paymentMethod === 'COD'

                            : `<span class="bg-purple-500/10 text-purple-400 border border-purple-500/30 px-2 py-1 rounded-sm"><i class="fa-solid fa-bolt mr-1"></i> UPI (${data.utr || 'N/A'})</span>`;
                        
                        let customerAddress = data.address ? data.address : "Address not provided";
                        let customerEmail = data.email ? data.email : "Email not provided";

                        html += `

                                <div>

                                    <p class="text-[10px] text-gray-500 mt-2">${dateString}</p>

                                </div>

                                <p class="text-sm font-medium text-white"><i class="fa-regular fa-user text-gold w-5 text-center"></i> ${data.customerName}</p>
                                <p class="text-xs text-gray-400 mt-1"><i class="fa-solid fa-envelope text-gold w-5 text-center"></i> <a href="mailto:${customerEmail}" class="hover:text-gold transition-colors">${customerEmail}</a></p>
                                <p class="text-xs text-gray-400 mt-1"><i class="fa-solid fa-phone text-gold w-5 text-center"></i> ${data.phone}</p>
                                <p class="text-xs text-gray-400 mt-1 leading-relaxed"><i class="fa-solid fa-location-dot text-gold w-5 text-center"></i> ${customerAddress}</p>
                                <div class="text-[9px] mt-3 tracking-widest uppercase font-bold">${methodBadge}</div>
                            </div>

                            <div class="mt-2 border-t border-white/5 pt-3">
                                <p class="text-[9px] text-gray-500 uppercase tracking-widest font-semibold mb-1">Purchased Items:</p>
                                ${itemsHTML}

                            <div class="mt-4 pt-4 border-t border-white/10 flex items-center justify-between gap-2">
                                <select id="status-${data.orderId}" class="flex-1 bg-black border border-white/10 text-gray-300 text-[10px] uppercase tracking-widest px-2 py-2.5 rounded-sm outline-none focus:border-gold">
                                    <option value="Verification Pending" ${data.status === 'Verification Pending' ? 'selected' : ''}>Verify Pending</option>
                                    <option value="Order Confirmed" ${data.status === 'Order Confirmed' ? 'selected' : ''}>Payment Verified</option>
                                    <option value="In Workshop" ${data.status === 'In Workshop' ? 'selected' : ''}>In Workshop</option>
                                    <option value="Shipped" ${data.status === 'Shipped' ? 'selected' : ''}>Shipped</option>
                                    <option value="Delivered" ${data.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
                                </select>
                                
                                <button id="btn-${data.orderId}" onclick="updateOrderStatus('${data.orderId}')" class="w-24 text-gold bg-gold/10 border border-gold/30 px-3 py-2.5 rounded-sm text-[10px] font-bold uppercase tracking-widest hover:bg-gold hover:text-black transition-colors" title="Update Status">
                                    Update
                                </button>

                                <button onclick="deleteOrder('${data.orderId}')" class="w-[38px] h-[34px] flex items-center justify-center text-red-400 bg-red-400/10 border border-red-400/30 rounded-sm hover:bg-red-500 hover:text-white transition-colors" title="Delete Order">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        </div>
                        `;
                    });
                    container.innerHTML = html;
                }
                document.getElementById(        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <i class="fa-solid fa-shield-halved text-gold text-2xl"></i>
                <div>
                    <h1 class="text-xl font-bold tracking-widest text-white serif-text">AVESTA</h1>
                    <p class="text-[9px] tracking-[0.3em] text-gold uppercase">Command Center</p>
                </div>
            </div>
            <button onclick="fetchOrders()" class="bg-gold/10 border border-gold/50 text-gold hover:bg-gold hover:text-black px-4 py-2 rounded-sm text-xs tracking-widest uppercase font-bold transition-all"><i class="fa-solid fa-arrows-rotate mr-2"></i>Refresh Orders</button>
        </div>
    </header>

          projectId: "avesta-web-6ab30",
          storageBucket: "avesta-web-6ab30.firebasestorage.app",
          messagingSenderId: "682614492313",
          appId: "1:682614492313:web:c81a3b9cf8ed0fa0affc08",
          measurementId: "G-CYFB840ML9"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentEditingOrderId = null;

        // Fetch Orders from Firebase automatically on load
        function fetchOrders() {
            const tableBody = document.getElementById("orders-table-body");
            tableBody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-gold text-xs tracking-widest uppercase animate-pulse"><i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Syncing Database...</td></tr>';

            db.collection("orders").orderBy("timestamp", "desc").get().then((querySnapshot) => {
                tableBody.innerHTML = "";
                document.getElementById('total-orders-count').innerText = querySnapshot.size;

                if (querySnapshot.empty) {
                    tableBody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-gray-500 text-xs tracking-widest uppercase">No orders found.</td></tr>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const orderId = doc.id;
                    const date = data.timestamp ? data.timestamp.toDate().toLocaleString('en-IN', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'}) : 'Just Now';
                    
                    // Default values if not set yet
                    const payStatus = data.paymentStatus || 'Pending';
                    const orderStatus = data.status || 'Verification Pending';
                    
                    // Formatting Badges
                    let payBadge = payStatus === 'Successful' ? 'text-green-400 bg-green-400/10 border border-green-400/20' : (payStatus === 'Failed' ? 'text-red-400 bg-red-400/10 border border-red-400/20' : 'text-yellow-400 bg-yellow-400/10 border border-yellow-400/20');
                    let statusBadge = orderStatus === 'Delivered' ? 'text-green-400' : 'text-gold';

                    let itemsHtml = data.items ? data.items.map(i => `${i.name} (x${i.quantity})`).join('<br>') : 'N/A';

                    const row = `
                        <tr class="hover:bg-white/5 transition-colors group">
                            <td class="p-4 align-top">
                                <p class="text-white font-medium tracking-wider mb-1">${orderId}</p>
                                <p class="text-[10px] text-gray-500 uppercase tracking-widest">${date}</p>
                            </td>
                            <td class="p-4 align-top">
                                <p class="text-white font-medium mb-1"><i class="fa-solid fa-user text-gray-500 mr-2 text-[10px]"></i>${data.customerName}</p>
                                <p class="text-[10px] text-gray-400 mb-1"><i class="fa-solid fa-phone text-gray-500 mr-2"></i>${data.phone}</p>
                                <p class="text-[10px] text-gray-400 truncate max-w-[200px]" title="${data.address}"><i class="fa-solid fa-location-dot text-gray-500 mr-2"></i>${data.address}</p>
                            </td>
                            <td class="p-4 align-top">
                                <p class="text-gold font-bold tracking-wide mb-1">₹${data.totalAmount ? data.totalAmount.toLocaleString('en-IN') : '0'}</p>
                                <p class="text-[10px] text-gray-400 uppercase tracking-widest border border-white/10 bg-black inline-block px-2 py-0.5 rounded-sm">${data.paymentMethod}</p>
                                ${data.paymentMethod === 'UPI' && data.utr ? `<p class="text-[9px] text-gray-500 mt-1">UTR: <span class="text-white select-all">${data.utr}</span></p>` : ''}
                            </td>
                            <td class="p-4 align-top">
                                <span class="px-2.5 py-1 text-[10px] uppercase tracking-widest font-semibold rounded-sm ${payBadge}">${payStatus}</span>
                            </td>
                            <td class="p-4 align-top">
                                <p class="${statusBadge} text-xs font-semibold uppercase tracking-widest"><i class="fa-solid fa-truck-fast mr-2 opacity-50"></i>${orderStatus}</p>
                            </td>
                            <td class="p-4 align-top text-center">
                                <button onclick="openAdminModal('${orderId}', '${payStatus}', '${orderStatus}')" class="bg-white/5 border border-white/10 hover:border-gold hover:text-gold text-gray-400 px-4 py-2 rounded-sm text-[10px] uppercase tracking-widest transition-colors"><i class="fa-solid fa-pen mr-2"></i> Update</button>
                            </td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            }).catch((error) => {
                console.error("Error fetching orders:", error);
                tableBody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-red-500 text-xs tracking-widest uppercase">Error connecting to Database. Check internet or permissions.</td></tr>';
            });
        }

        // Modal Logic
        function openAdminModal(orderId, currentPayment, currentStatus) {
            currentEditingOrderId = orderId;
            document.getElementById('admin-modal-order-id').innerText = orderId;
            document.getElementById('admin-payment-status').value = currentPayment;
            document.getElementById('admin-order-status').value = currentStatus;
            
            const modal = document.getElementById('admin-order-modal');
            const box = document.getElementById('modal-box');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => box.classList.replace('scale-95', 'scale-100'), 10);
        }

        function closeAdminModal() {
            const modal = document.getElementById('admin-order-modal');
            const box = document.getElementById('modal-box');
            box.classList.replace('scale-100', 'scale-95');
            setTimeout(() => {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
            }, 200);
        }

        // Save Logic to Firebase
        function saveAdminOrderStatus() {
            if (!currentEditingOrderId) return;

            const newPayment = document.getElementById('admin-payment-status').value;
            const newStatus = document.getElementById('admin-order-status').value;
            const btn = document.getElementById('save-btn');
            
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i>Saving...';
            btn.disabled = true;

            // Update document in Firestore
            db.collection("orders").doc(currentEditingOrderId).update({
                paymentStatus: newPayment,
                status: newStatus
            }).then(() => {
                closeAdminModal();
                fetchOrders(); // Refresh table
            }).catch((error) => {
                console.error("Error updating order: ", error);
                alert("Failed to update order details.");
            }).finally(() => {
                btn.innerHTML = 'Save Changes';
                btn.disabled = false;
            });
        }

        // Load orders immediately when page opens
        window.onload = fetchOrders;
    </script>
</body>
</html>
