<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVESTA | Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { gold: '#C5A059', black: '#0A0A0A', darkgray: '#141414' }, fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Cinzel', 'serif'] } } } }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0A0A0A; color: white; }
        .serif-text { font-family: 'Cinzel', serif; }
        .glass-panel { background: rgba(20, 20, 20, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(197, 160, 89, 0.2); }
        .input-gold { background: rgba(255,255,255,0.05); border: 1px solid rgba(197,160,89,0.3); color: white; outline: none; transition: 0.3s; }
        .input-gold:focus { border-color: #C5A059; background: rgba(255,255,255,0.1); }
        select option { background-color: #141414; color: white; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

    <header class="w-full bg-black border-b border-gold/20 py-4 sticky top-0 z-50 shadow-lg">
        <div class="px-4 flex justify-between items-center max-w-3xl mx-auto w-full">
            <h1 class="text-xl font-bold tracking-widest text-gold serif-text">AVESTA HQ</h1>
            <button id="logout-btn" onclick="logout()" class="hidden text-gray-400 hover:text-white text-xs tracking-widest uppercase font-semibold border border-gray-700 px-3 py-1 rounded-sm"><i class="fa-solid fa-right-from-bracket mr-1"></i> Exit</button>
        </div>
    </header>

    <main id="login-section" class="flex-1 flex flex-col items-center justify-center p-4">
        <div class="glass-panel p-8 rounded-lg w-full max-w-sm text-center shadow-[0_0_40px_rgba(197,160,89,0.05)]">
            <i class="fa-solid fa-lock text-4xl text-gold/50 mb-4"></i>
            <h2 class="text-xl text-white mb-2 serif-text tracking-widest">Restricted Access</h2>
            <input type="password" id="admin-password" placeholder="Enter Access Code" class="input-gold w-full px-4 py-3 rounded-sm mb-4 text-center tracking-widest text-sm" onkeypress="if(event.key === 'Enter') checkPassword()">
            <button onclick="checkPassword()" class="w-full bg-gold/10 border border-gold/50 text-gold py-3 rounded-sm text-xs font-bold tracking-[0.2em] uppercase hover:bg-gold hover:text-black transition-colors">Authenticate</button>
            <p id="login-error" class="text-red-400 text-[10px] uppercase tracking-widest mt-4 hidden">Access Denied. Invalid Code.</p>
        </div>
    </main>

    <main id="dashboard-section" class="hidden flex-1 flex-col p-4 md:p-8 max-w-3xl mx-auto w-full">
        <div class="flex justify-between items-end mb-6 border-b border-white/10 pb-4">
            <div>
                <h2 class="text-2xl text-white serif-text tracking-widest">Live Orders</h2>
                <p class="text-gray-500 text-[10px] uppercase tracking-widest mt-1">Real-time database sync active</p>
            </div>
            <button onclick="fetchOrders()" class="text-gold hover:text-white text-lg transition-transform hover:rotate-180 duration-500"><i class="fa-solid fa-arrows-rotate"></i></button>
        </div>
        <div id="loading-spinner" class="flex flex-col items-center justify-center py-20">
            <i class="fa-solid fa-circle-notch text-gold text-3xl animate-spin mb-4"></i>
            <p class="text-gray-400 text-[10px] tracking-[0.2em] uppercase animate-pulse">Decrypting Vault Data...</p>
        </div>
        <div id="orders-container" class="space-y-4 hidden pb-10"></div>
    </main>

    <div id="admin-order-modal" class="fixed inset-0 z-[100] hidden items-center justify-center p-4 bg-black/90 backdrop-blur-sm transition-opacity font-sans">
        <div class="glass-panel border border-gold/30 bg-[#0a0a0a] rounded-lg w-full max-w-md shadow-[0_0_50px_rgba(197,160,89,0.1)] relative overflow-hidden">
            <div class="flex justify-between items-center p-5 border-b border-gold/10 bg-black">
                <h3 class="text-gold font-bold tracking-[0.2em] uppercase text-sm"><i class="fa-solid fa-pen-to-square mr-2"></i> Update Order</h3>
                <button type="button" onclick="closeAdminModal()" class="text-gray-400 hover:text-white transition-colors text-xl leading-none"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-6 space-y-5">
                <div class="flex justify-between items-center border-b border-white/5 pb-3">
                    <p class="text-xs text-gray-500 uppercase tracking-widest font-semibold">Order Ref:</p>
                    <p id="admin-modal-order-id" class="text-white font-bold tracking-wider">AV-XXXXXX</p>
                </div>
                <div>
                    <label class="text-[10px] text-gray-400 uppercase tracking-widest mb-2 block font-semibold">Payment Status</label>
                    <select id="admin-payment-status" class="w-full bg-black border border-white/20 text-white p-3 rounded-sm outline-none focus:border-gold transition-all text-xs tracking-wide appearance-none cursor-pointer">
                        <option value="Pending">Pending (Waiting for UTR/COD)</option>
                        <option value="Successful">Payment Successful ✅</option>
                        <option value="Failed">Payment Failed / Rejected ❌</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] text-gray-400 uppercase tracking-widest mb-2 block font-semibold">Delivery / Tracking Status</label>
                    <select id="admin-order-status" class="w-full bg-[#050505] border border-gold/50 text-gold p-3 rounded-sm outline-none focus:border-gold transition-all text-xs tracking-wide appearance-none font-medium cursor-pointer">
                        <option value="Verification Pending">1. Verification Pending</option>
                        <option value="Order Confirmed">2. Order Confirmed</option>
                        <option value="In Workshop">3. In Workshop (Assembling)</option>
                        <option value="Shipped">4. Shipped (Out for Delivery)</option>
                        <option value="Delivered">5. Delivered 🎉</option>
                        <option value="Cancelled">Cancelled 🚫</option>
                    </select>
                </div>
            </div>
            <div class="p-5 border-t border-white/10 flex gap-3 bg-black/50">
                <button type="button" onclick="closeAdminModal()" class="flex-1 py-3 text-gray-400 border border-white/20 rounded-sm hover:text-white hover:border-white transition-all text-[10px] uppercase tracking-widest font-bold">Cancel</button>
                <button type="button" onclick="saveAdminOrderStatus()" id="save-modal-btn" class="flex-1 py-3 bg-gold/10 border border-gold text-gold font-bold rounded-sm hover:bg-gold hover:text-black transition-all text-[10px] uppercase tracking-widest shadow-lg">Save Changes</button>
            </div>
        </div>
    </div>

    <div id="custom-confirm-modal" class="fixed inset-0 z-[100] hidden items-center justify-center p-4 bg-black/90 backdrop-blur-sm transition-opacity font-sans">
        <div class="glass-panel border border-red-500/30 bg-[#0a0a0a] rounded-lg w-full max-w-sm p-6 text-center shadow-[0_0_50px_rgba(239,68,68,0.1)] relative">
            <div class="w-12 h-12 rounded-full border border-red-500/30 bg-red-500/10 flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-triangle-exclamation text-red-500 text-xl"></i>
            </div>
            <h3 class="text-white text-lg serif-text tracking-widest mb-2">Delete Order?</h3>
            <p id="confirm-modal-text" class="text-gray-400 text-xs font-light leading-relaxed mb-6"></p>
            <div class="flex gap-3">
                <button onclick="closeConfirmModal()" class="flex-1 border border-white/20 text-gray-400 hover:text-white hover:border-white py-2.5 rounded-sm text-[10px] tracking-widest uppercase font-bold transition-all">Cancel</button>
                <button onclick="executeDelete()" class="flex-1 bg-red-500/10 border border-red-500/50 text-red-500 hover:bg-red-500 hover:text-white py-2.5 rounded-sm text-[10px] tracking-widest uppercase font-bold transition-all shadow-lg">Delete</button>
            </div>
        </div>
    </div>

    <div id="custom-alert-modal" class="fixed inset-0 z-[110] hidden items-center justify-center p-4 bg-black/90 backdrop-blur-sm transition-opacity font-sans">
        <div class="glass-panel border border-gold/30 bg-[#0a0a0a] rounded-lg w-full max-w-sm p-6 text-center shadow-[0_0_50px_rgba(197,160,89,0.1)] relative">
            <div id="alert-icon-container" class="w-12 h-12 rounded-full border flex items-center justify-center mx-auto mb-4">
                <i id="alert-icon" class="fa-solid text-xl"></i>
            </div>
            <h3 id="alert-title" class="text-white text-lg serif-text tracking-widest mb-2">Notice</h3>
            <p id="alert-modal-text" class="text-gray-400 text-xs font-light leading-relaxed mb-6"></p>
            <button onclick="closeAlertModal()" class="w-full bg-gold/10 border border-gold/30 text-gold hover:bg-gold hover:text-black py-2.5 rounded-sm text-[10px] tracking-widest uppercase font-bold transition-all">Okay</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyAN3SStrczNH5cwhU9o5Whg0QVbaRAlUpg",
          authDomain: "avesta-web-6ab30.firebaseapp.com",
          projectId: "avesta-web-6ab30",
          storageBucket: "avesta-web-6ab30.firebasestorage.app",
          messagingSenderId: "682614492313",
          appId: "1:682614492313:web:c81a3b9cf8ed0fa0affc08",
          measurementId: "G-CYFB840ML9"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const SECRET_CODE = "AvestaAdmin2026"; 
        let currentOrderIdToDelete = null;
        let currentEditingOrderId = null; // New variable for the Update Modal

        if(sessionStorage.getItem("avesta_admin") === "true") { showDashboard(); }

        function checkPassword() {
            if(document.getElementById("admin-password").value === SECRET_CODE) { sessionStorage.setItem("avesta_admin", "true"); showDashboard(); } 
            else { document.getElementById("login-error").classList.remove("hidden"); }
        }

        function logout() {
            sessionStorage.removeItem("avesta_admin");
            document.getElementById("dashboard-section").classList.add("hidden");
            document.getElementById("logout-btn").classList.add("hidden");
            document.getElementById("login-section").classList.remove("hidden");
            document.getElementById("login-section").classList.add("flex");
            document.getElementById("admin-password").value = "";
            document.getElementById("login-error").classList.add("hidden");
        }

        function showDashboard() {
            document.getElementById("login-section").classList.add("hidden");
            document.getElementById("login-section").classList.remove("flex");
            document.getElementById("dashboard-section").classList.remove("hidden");
            document.getElementById("dashboard-section").classList.add("flex");
            document.getElementById("logout-btn").classList.remove("hidden");
            fetchOrders();
        }

        function showCustomAlert(title, message, type) {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-modal-text').innerHTML = message;
            
            const iconContainer = document.getElementById('alert-icon-container');
            const icon = document.getElementById('alert-icon');
            
            if(type === 'success') {
                iconContainer.className = "w-12 h-12 rounded-full border border-green-500/30 bg-green-500/10 flex items-center justify-center mx-auto mb-4";
                icon.className = "fa-solid fa-check text-green-400 text-xl";
            } else {
                iconContainer.className = "w-12 h-12 rounded-full border border-red-500/30 bg-red-500/10 flex items-center justify-center mx-auto mb-4";
                icon.className = "fa-solid fa-xmark text-red-500 text-xl";
            }

            document.getElementById('custom-alert-modal').classList.remove('hidden');
            document.getElementById('custom-alert-modal').classList.add('flex');
        }

        function closeAlertModal() {
            document.getElementById('custom-alert-modal').classList.add('hidden');
            document.getElementById('custom-alert-modal').classList.remove('flex');
        }

        // --- NEW UPDATE MODAL LOGIC ---
        function openAdminModal(orderId, currentPayment, currentStatus) {
            currentEditingOrderId = orderId;
            document.getElementById('admin-modal-order-id').innerText = orderId;
            document.getElementById('admin-payment-status').value = currentPayment;
            document.getElementById('admin-order-status').value = currentStatus;
            
            document.getElementById('admin-order-modal').classList.remove('hidden');
            document.getElementById('admin-order-modal').classList.add('flex');
        }

        function closeAdminModal() {
            document.getElementById('admin-order-modal').classList.add('hidden');
            document.getElementById('admin-order-modal').classList.remove('flex');
            currentEditingOrderId = null;
        }

        async function saveAdminOrderStatus() {
            if (!currentEditingOrderId) return;

            const newPayment = document.getElementById('admin-payment-status').value;
            const newStatus = document.getElementById('admin-order-status').value;
            const btn = document.getElementById('save-modal-btn');
            
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i>Saving...';
            
            try {
                await db.collection("orders").doc(currentEditingOrderId).update({
                    paymentStatus: newPayment,
                    status: newStatus
                });
                showCustomAlert("Success", `Order <strong>#${currentEditingOrderId}</strong> updated successfully.`, "success");
                closeAdminModal();
                fetchOrders(); // Refresh to show new changes
            } catch (error) {
                showCustomAlert("Error", "Failed to update order. Please try again.", "error");
            } finally {
                btn.innerHTML = 'Save Changes';
            }
        }
        // ------------------------------

        function deleteOrder(orderId) {
            currentOrderIdToDelete = orderId;
            document.getElementById('confirm-modal-text').innerHTML = `Are you sure you want to permanently delete <strong>Order #${orderId}</strong>?<br><br>This action cannot be undone.`;
            document.getElementById('custom-confirm-modal').classList.remove('hidden');
            document.getElementById('custom-confirm-modal').classList.add('flex');
        }

        function closeConfirmModal() {
            document.getElementById('custom-confirm-modal').classList.add('hidden');
            document.getElementById('custom-confirm-modal').classList.remove('flex');
            currentOrderIdToDelete = null;
        }

        async function executeDelete() {
            if(!currentOrderIdToDelete) return;
            const orderId = currentOrderIdToDelete;
            closeConfirmModal();

            try {
                await db.collection("orders").doc(orderId).delete();
                showCustomAlert("Success", `Order <strong>#${orderId}</strong> has been deleted successfully.`, "success");
                fetchOrders(); 
            } catch (error) {
                showCustomAlert("Error", "Failed to delete order. Please try again.", "error");
            }
        }

        async function fetchOrders() {
            document.getElementById("orders-container").classList.add("hidden");
            document.getElementById("loading-spinner").classList.remove("hidden");
            document.getElementById("loading-spinner").classList.add("flex");

            try {
                const snapshot = await db.collection("orders").orderBy("timestamp", "desc").get();
                const container = document.getElementById("orders-container");
                
                if (snapshot.empty) {
                    container.innerHTML = '<div class="text-center text-gray-500 py-10 text-xs tracking-widest uppercase"><i class="fa-solid fa-box-open text-2xl mb-3 block"></i> No orders found</div>';
                } else {
                    let html = '';
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        
                        let dateString = "Pending Sync";
                        if(data.timestamp) {
                            dateString = data.timestamp.toDate().toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'});
                        }

                        let itemsHTML = '';
                        if(data.items && data.items.length > 0) {
                            data.items.forEach(item => {
                                let colorText = (item.selectedColor && item.selectedColor !== 'Default') ? ` (${item.selectedColor})` : '';
                                itemsHTML += `<div class="flex justify-between text-[10px] text-gray-400 mt-2 bg-black p-2 rounded-sm border border-white/5"><span class="truncate pr-2">${item.quantity}x ${item.name}<span class="text-gold">${colorText}</span></span><span class="text-gold">₹${(item.price * item.quantity).toLocaleString('en-IN')}</span></div>`;
                            });
                        }

                        let statusColor = "text-gray-400";
                        if(data.status === "Verification Pending") statusColor = "text-red-400";
                        if(data.status === "Order Confirmed") statusColor = "text-yellow-400";
                        if(data.status === "In Workshop") statusColor = "text-blue-400";
                        if(data.status === "Shipped") statusColor = "text-purple-400";
                        if(data.status === "Delivered") statusColor = "text-green-400";

                        let methodBadge = data.paymentMethod === 'COD' 
                            ? `<span class="bg-blue-500/10 text-blue-400 border border-blue-500/30 px-2 py-1 rounded-sm"><i class="fa-solid fa-truck-fast mr-1"></i> COD</span>`
                            : `<span class="bg-purple-500/10 text-purple-400 border border-purple-500/30 px-2 py-1 rounded-sm"><i class="fa-solid fa-bolt mr-1"></i> UPI (${data.utr || 'N/A'})</span>`;
                        
                        let customerAddress = data.address ? data.address : "Address not provided";
                        let customerEmail = data.email ? data.email : "Email not provided";
                        
                        let payStatus = data.paymentStatus || 'Pending';
                        let payStatusColor = payStatus === 'Successful' ? 'text-green-400' : (payStatus === 'Failed' ? 'text-red-400' : 'text-yellow-400');
                        let currentStatus = data.status || 'Verification Pending';

                        html += `
                        <div class="glass-panel p-4 md:p-5 rounded-md relative overflow-hidden group hover:border-gold/40 transition-colors">
                            <div class="flex justify-between items-start mb-3 border-b border-white/10 pb-3">
                                <div>
                                    <span class="bg-gold/20 text-gold text-[9px] font-bold px-2 py-0.5 rounded-sm tracking-widest uppercase border border-gold/30">#${data.orderId}</span>
                                    <p class="text-[10px] text-gray-500 mt-2">${dateString}</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-lg font-medium text-white tracking-wide">₹${(data.totalAmount || 0).toLocaleString('en-IN')}</p>
                                    <p class="text-[9px] ${statusColor} uppercase tracking-widest font-semibold mt-1"><i class="fa-solid fa-circle text-[6px] mr-1 mb-0.5"></i>${currentStatus}</p>
                                </div>
                            </div>
                            
                            <div class="pt-1 pb-2">
                                <p class="text-sm font-medium text-white"><i class="fa-regular fa-user text-gold w-5 text-center"></i> ${data.customerName}</p>
                                <p class="text-xs text-gray-400 mt-1"><i class="fa-solid fa-envelope text-gold w-5 text-center"></i> <a href="mailto:${customerEmail}" class="hover:text-gold transition-colors">${customerEmail}</a></p>
                                <p class="text-xs text-gray-400 mt-1"><i class="fa-solid fa-phone text-gold w-5 text-center"></i> ${data.phone}</p>
                                <p class="text-xs text-gray-400 mt-1 leading-relaxed"><i class="fa-solid fa-location-dot text-gold w-5 text-center"></i> ${customerAddress}</p>
                                <div class="text-[9px] mt-3 tracking-widest uppercase font-bold">${methodBadge}</div>
                            </div>

                            <div class="mt-2 border-t border-white/5 pt-3">
                                <p class="text-[9px] text-gray-500 uppercase tracking-widest font-semibold mb-1">Purchased Items:</p>
                                ${itemsHTML}
                            </div>
                            
                            <div class="mt-4 pt-4 border-t border-white/10 flex items-center justify-between gap-3">
                                <div class="text-[9px] text-gray-400 uppercase tracking-widest flex-1">
                                    Pay: <span class="${payStatusColor} font-bold">${payStatus}</span>
                                </div>
                                
                                <button onclick="openAdminModal('${data.orderId}', '${payStatus}', '${currentStatus}')" class="flex-1 text-gold bg-gold/10 border border-gold/30 px-3 py-2.5 rounded-sm text-[10px] font-bold uppercase tracking-widest hover:bg-gold hover:text-black transition-colors">
                                    <i class="fa-solid fa-pen mr-1"></i> Update
                                </button>

                                <button onclick="deleteOrder('${data.orderId}')" class="w-[38px] h-[36px] flex items-center justify-center text-red-400 bg-red-400/10 border border-red-400/30 rounded-sm hover:bg-red-500 hover:text-white transition-colors" title="Delete Order">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        </div>
                        `;
                    });
                    container.innerHTML = html;
                }
                document.getElementById("loading-spinner").classList.add("hidden");
                document.getElementById("loading-spinner").classList.remove("flex");
                container.classList.remove("hidden");
            } catch(error) {
                document.getElementById("loading-spinner").innerHTML = '<p class="text-red-400 text-xs tracking-widest uppercase">Connection Error. Retrying...</p>';
            }
        }
    </script>
</body>
</html>
