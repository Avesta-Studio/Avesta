<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVESTA | VIP Admin Dashboard</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { gold: '#C5A059', black: '#0A0A0A', darkgray: '#141414' },
                    fontFamily: { 'sans': ['Inter', 'sans-serif'], 'serif': ['Cinzel', 'serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0A0A0A; color: white; }
        .serif-text { font-family: 'Cinzel', serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0A0A0A; }
        ::-webkit-scrollbar-thumb { background: #C5A059; border-radius: 10px; }
    </style>
</head>
<body class="antialiased selection:bg-gold selection:text-black">

    <header class="w-full bg-darkgray border-b border-gold/20 sticky top-0 z-40 shadow-md">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <i class="fa-solid fa-shield-halved text-gold text-2xl"></i>
                <div>
                    <h1 class="text-xl font-bold tracking-widest text-white serif-text">AVESTA</h1>
                    <p class="text-[9px] tracking-[0.3em] text-gold uppercase">Command Center</p>
                </div>
            </div>
            <button onclick="fetchOrders()" class="bg-gold/10 border border-gold/50 text-gold hover:bg-gold hover:text-black px-4 py-2 rounded-sm text-xs tracking-widest uppercase font-bold transition-all"><i class="fa-solid fa-arrows-rotate mr-2"></i>Refresh Orders</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-10">
        <div class="mb-6 flex justify-between items-end">
            <h2 class="text-2xl text-white font-medium serif-text tracking-wide">Recent Orders</h2>
            <p class="text-xs text-gray-500 uppercase tracking-widest">Total Orders: <span id="total-orders-count" class="text-gold font-bold">0</span></p>
        </div>

        <div class="bg-darkgray border border-white/10 rounded-lg overflow-hidden shadow-lg overflow-x-auto">
            <table class="w-full text-left border-collapse whitespace-nowrap">
                <thead>
                    <tr class="bg-black border-b border-gold/20 text-gold text-[10px] uppercase tracking-widest">
                        <th class="p-4 font-semibold">Order ID / Date</th>
                        <th class="p-4 font-semibold">Customer Details</th>
                        <th class="p-4 font-semibold">Amount & Method</th>
                        <th class="p-4 font-semibold">Payment Status</th>
                        <th class="p-4 font-semibold">Delivery Status</th>
                        <th class="p-4 font-semibold text-center">Action</th>
                    </tr>
                </thead>
                <tbody id="orders-table-body" class="text-sm font-light text-gray-300 divide-y divide-white/5">
                    <tr>
                        <td colspan="6" class="p-8 text-center text-gray-500 text-xs tracking-widest uppercase animate-pulse">Loading orders from database...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div id="admin-order-modal" class="fixed inset-0 z-[100] hidden bg-black/90 backdrop-blur-sm items-center justify-center p-4 font-sans transition-opacity">
        <div class="bg-[#141414] border border-gold/30 rounded-lg w-full max-w-md shadow-[0_0_50px_rgba(197,160,89,0.1)] relative overflow-hidden transform transition-all scale-95" id="modal-box">
            
            <div class="flex justify-between items-center p-5 border-b border-gold/10 bg-black">
                <h3 class="text-gold font-bold tracking-[0.2em] uppercase text-sm"><i class="fa-solid fa-pen-to-square mr-2"></i>Update Order</h3>
                <button type="button" onclick="closeAdminModal()" class="text-gray-400 hover:text-white transition-colors text-xl leading-none"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="p-6 space-y-6">
                <div class="flex justify-between items-center border-b border-white/5 pb-3">
                    <p class="text-xs text-gray-500 uppercase tracking-widest font-semibold">Order Ref:</p>
                    <p id="admin-modal-order-id" class="text-white font-bold tracking-wider">AV-XXXXXX</p>
                </div>

                <div>
                    <label class="text-[10px] text-gray-400 uppercase tracking-widest mb-2 block font-semibold">Payment Status</label>
                    <select id="admin-payment-status" class="w-full bg-black border border-white/20 text-white p-3 rounded-sm outline-none focus:border-gold transition-all text-sm tracking-wide appearance-none cursor-pointer">
                        <option value="Pending">Pending (Waiting for UTR / COD)</option>
                        <option value="Successful">Payment Successful ✅</option>
                        <option value="Failed">Payment Failed / Rejected ❌</option>
                    </select>
                </div>

                <div>
                    <label class="text-[10px] text-gray-400 uppercase tracking-widest mb-2 block font-semibold">Delivery / Tracking Status</label>
                    <select id="admin-order-status" class="w-full bg-[#050505] border border-gold/50 text-gold p-3 rounded-sm outline-none focus:border-gold transition-all text-sm tracking-wide appearance-none font-medium cursor-pointer">
                        <option value="Verification Pending">1. Verification Pending</option>
                        <option value="Order Confirmed">2. Order Confirmed</option>
                        <option value="In Workshop">3. In Workshop (Assembling)</option>
                        <option value="Shipped">4. Shipped (Out for Delivery)</option>
                        <option value="Delivered">5. Delivered 🎉</option>
                        <option value="Cancelled">Cancelled 🚫</option>
                    </select>
                </div>
            </div>
            
            <div class="p-5 border-t border-white/10 flex gap-4 bg-black/50">
                <button type="button" onclick="closeAdminModal()" class="flex-1 py-3 text-gray-400 border border-white/20 rounded-sm hover:text-white hover:border-white transition-all text-xs uppercase tracking-widest font-medium">Cancel</button>
                <button type="button" onclick="saveAdminOrderStatus()" id="save-btn" class="flex-1 py-3 bg-gold/10 border border-gold text-gold font-bold rounded-sm hover:bg-gold hover:text-black transition-all text-xs uppercase tracking-widest shadow-lg">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        // Exact Same Firebase Config from your main website
        const firebaseConfig = {
          apiKey: "AIzaSyAN3SStrczNH5cwhU9o5Whg0QVbaRAlUpg",
          authDomain: "avesta-web-6ab30.firebaseapp.com",
          projectId: "avesta-web-6ab30",
          storageBucket: "avesta-web-6ab30.firebasestorage.app",
          messagingSenderId: "682614492313",
          appId: "1:682614492313:web:c81a3b9cf8ed0fa0affc08",
          measurementId: "G-CYFB840ML9"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentEditingOrderId = null;

        // Fetch Orders from Firebase automatically on load
        function fetchOrders() {
            const tableBody = document.getElementById("orders-table-body");
            tableBody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-gold text-xs tracking-widest uppercase animate-pulse"><i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Syncing Database...</td></tr>';

            db.collection("orders").orderBy("timestamp", "desc").get().then((querySnapshot) => {
                tableBody.innerHTML = "";
                document.getElementById('total-orders-count').innerText = querySnapshot.size;

                if (querySnapshot.empty) {
                    tableBody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-gray-500 text-xs tracking-widest uppercase">No orders found.</td></tr>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const orderId = doc.id;
                    const date = data.timestamp ? data.timestamp.toDate().toLocaleString('en-IN', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'}) : 'Just Now';
                    
                    // Default values if not set yet
                    const payStatus = data.paymentStatus || 'Pending';
                    const orderStatus = data.status || 'Verification Pending';
                    
                    // Formatting Badges
                    let payBadge = payStatus === 'Successful' ? 'text-green-400 bg-green-400/10 border border-green-400/20' : (payStatus === 'Failed' ? 'text-red-400 bg-red-400/10 border border-red-400/20' : 'text-yellow-400 bg-yellow-400/10 border border-yellow-400/20');
                    let statusBadge = orderStatus === 'Delivered' ? 'text-green-400' : 'text-gold';

                    let itemsHtml = data.items ? data.items.map(i => `${i.name} (x${i.quantity})`).join('<br>') : 'N/A';

                    const row = `
                        <tr class="hover:bg-white/5 transition-colors group">
                            <td class="p-4 align-top">
                                <p class="text-white font-medium tracking-wider mb-1">${orderId}</p>
                                <p class="text-[10px] text-gray-500 uppercase tracking-widest">${date}</p>
                            </td>
                            <td class="p-4 align-top">
                                <p class="text-white font-medium mb-1"><i class="fa-solid fa-user text-gray-500 mr-2 text-[10px]"></i>${data.customerName}</p>
                                <p class="text-[10px] text-gray-400 mb-1"><i class="fa-solid fa-phone text-gray-500 mr-2"></i>${data.phone}</p>
                                <p class="text-[10px] text-gray-400 truncate max-w-[200px]" title="${data.address}"><i class="fa-solid fa-location-dot text-gray-500 mr-2"></i>${data.address}</p>
                            </td>
                            <td class="p-4 align-top">
                                <p class="text-gold font-bold tracking-wide mb-1">₹${data.totalAmount ? data.totalAmount.toLocaleString('en-IN') : '0'}</p>
                                <p class="text-[10px] text-gray-400 uppercase tracking-widest border border-white/10 bg-black inline-block px-2 py-0.5 rounded-sm">${data.paymentMethod}</p>
                                ${data.paymentMethod === 'UPI' && data.utr ? `<p class="text-[9px] text-gray-500 mt-1">UTR: <span class="text-white select-all">${data.utr}</span></p>` : ''}
                            </td>
                            <td class="p-4 align-top">
                                <span class="px-2.5 py-1 text-[10px] uppercase tracking-widest font-semibold rounded-sm ${payBadge}">${payStatus}</span>
                            </td>
                            <td class="p-4 align-top">
                                <p class="${statusBadge} text-xs font-semibold uppercase tracking-widest"><i class="fa-solid fa-truck-fast mr-2 opacity-50"></i>${orderStatus}</p>
                            </td>
                            <td class="p-4 align-top text-center">
                                <button onclick="openAdminModal('${orderId}', '${payStatus}', '${orderStatus}')" class="bg-white/5 border border-white/10 hover:border-gold hover:text-gold text-gray-400 px-4 py-2 rounded-sm text-[10px] uppercase tracking-widest transition-colors"><i class="fa-solid fa-pen mr-2"></i> Update</button>
                            </td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            }).catch((error) => {
                console.error("Error fetching orders:", error);
                tableBody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-red-500 text-xs tracking-widest uppercase">Error connecting to Database. Check internet or permissions.</td></tr>';
            });
        }

        // Modal Logic
        function openAdminModal(orderId, currentPayment, currentStatus) {
            currentEditingOrderId = orderId;
            document.getElementById('admin-modal-order-id').innerText = orderId;
            document.getElementById('admin-payment-status').value = currentPayment;
            document.getElementById('admin-order-status').value = currentStatus;
            
            const modal = document.getElementById('admin-order-modal');
            const box = document.getElementById('modal-box');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => box.classList.replace('scale-95', 'scale-100'), 10);
        }

        function closeAdminModal() {
            const modal = document.getElementById('admin-order-modal');
            const box = document.getElementById('modal-box');
            box.classList.replace('scale-100', 'scale-95');
            setTimeout(() => {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
            }, 200);
        }

        // Save Logic to Firebase
        function saveAdminOrderStatus() {
            if (!currentEditingOrderId) return;

            const newPayment = document.getElementById('admin-payment-status').value;
            const newStatus = document.getElementById('admin-order-status').value;
            const btn = document.getElementById('save-btn');
            
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i>Saving...';
            btn.disabled = true;

            // Update document in Firestore
            db.collection("orders").doc(currentEditingOrderId).update({
                paymentStatus: newPayment,
                status: newStatus
            }).then(() => {
                closeAdminModal();
                fetchOrders(); // Refresh table
            }).catch((error) => {
                console.error("Error updating order: ", error);
                alert("Failed to update order details.");
            }).finally(() => {
                btn.innerHTML = 'Save Changes';
                btn.disabled = false;
            });
        }

        // Load orders immediately when page opens
        window.onload = fetchOrders;
    </script>
</body>
</html>
